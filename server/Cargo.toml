[package]
name = "chat-rs-api"
version = "0.6.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10.3"
astral-tokio-tar = "0.5.6"
base64 = "0.22.1"
bollard = { version = "0.19.4", features = ["ssl"] }
bon = "3.9"
chrono = { version = "0.4.43", features = ["serde"] }
const_format = "0.2.35"
diesel = { version = "2.3.6", features = [
  "chrono",
  "postgres",
  "serde_json",
  "uuid",
] }
diesel_as_jsonb = "1.0.1"
diesel-async = { version = "0.7.4", features = [
  "async-connection-wrapper",
  "deadpool",
  "postgres"
] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
diesel_migrations = { version = "2.3.1", features = ["postgres"] }
dotenvy = "0.15.7"
dyn-clone = "1.0.20"
enum-iterator = "2.3.0"
fred = { version = "10.1.0", default-features = false, features = [
  "i-keys",
  "i-streams",
] }
hex = "0.4.3"
jsonschema = { version = "0.30.0", default-features = false }
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
  "stream",
] }
reqwest-websocket = { version = "0.5.1", features = ["json"] }
rocket = { version = "0.5.1", features = ["json", "uuid"] }
rocket_flex_session = { version = "0.2.0", features = [
  "redis_fred",
  "rocket_okapi",
] }
rocket_oauth2 = "0.5.0"
rocket_okapi = { version = "0.9.0", features = ["rapidoc"] }
schemars = { version = "0.8.22", features = ["chrono", "uuid1"] }
serde = { version = "1.0.228" }
serde_json = "1.0.149"
subst = { version = "0.3.8", features = ["json"] }
thiserror = "2.0.18"
tinistream-client = { git = "https://github.com/fa-sharp/tinistream", rev = "c37e41d" }
tokio = { version = "1.49.0" }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
urlencoding = "2.1.3"
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[profile.release]
opt-level = 2
strip = true
lto = "thin"
panic = "abort"
codegen-units = 4

[profile.ci]
inherits = "dev"
codegen-units = 256
