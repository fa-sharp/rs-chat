app = "rs-chat"
primary_region = "ewr"

[build]

[env]
RUST_LOG = "info"
RS_CHAT_SERVER_ADDRESS = "https://rs-chat.fly.dev"
DOCKER_CERT_PATH = "/certs"
DOCKER_TLS_VERIFY = "1"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
memory = "1gb"
cpu_kind = "shared"
cpus = 2

[mounts]
source = "data"
destination = "/data"
initial_size = "2gb"

[[files]]
guest_path = "/certs/ca.pem"
secret_name = "DOCKER_CA_CERT"

[[files]]
guest_path = "/certs/cert.pem"
secret_name = "DOCKER_CLIENT_CERT"

[[files]]
guest_path = "/certs/key.pem"
secret_name = "DOCKER_CLIENT_KEY"
