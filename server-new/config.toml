[server]
host = "127.0.0.1"
port = 8080
base_url = "http://localhost:8080"
log_level = "info"
request_id_header = "x-request-id"

[database]
url = "postgres://localhost"

[redis]
url = "redis://localhost:6379"
pool_size = 4
timeout = 10

[services]
streamer_url = "http://localhost:8081"
streamer_api_key = "dev-streamer-api-key"

[auth]
cookie_name = "auth-rs-chat"
session_length = 604800

[security]
body_limit = 2097152
request_timeout = 120
