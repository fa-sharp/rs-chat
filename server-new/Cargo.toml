[package]
name = "rs-chat-api"
version = "0.1.0"
edition = "2024"
description = "RsChat Server"
publish = false

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json", "query"] }
axum-helmet = "1.0.2"
axum-plugin = {
  git = "https://git.fasharp.io/fa-sharp/axum-plugin",
  rev = "9f72278b3c"
}
chrono = {
  version = "0.4.45",
  default-features = false,
  features = ["now", "serde", "std"]
}
diesel = {
  version = "2.3.10",
  default-features = false,
  features = ["chrono", "serde_json", "uuid"]
}
diesel-async = {
  version = "0.9.2",
  features = ["deadpool", "migrations", "postgres"]
}
diesel-jsonb-derive = { path = "crates/diesel-jsonb-derive" }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env", "toml"] }
fred = {
  version = "10.1.0",
  default-features = false,
  features = ["i-keys", "i-streams"]
}
futures = "0.3.32"
hex = "0.4.3"
reqwest = {
  version = "0.13.4",
  default-features = false,
  features = ["default-tls", "json"]
}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = {
  version = "3.21.0",
  default-features = false,
  features = ["macros"]
}
simple-oauth = { path = "crates/simple-oauth/", features = ["default-tls"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = {
  version = "1.52.3",
  default-features = false,
  features = ["macros", "net", "rt", "rt-multi-thread", "signal"]
}
tower = { version = "0.5", default-features = false }
tower-http = {
  version = "0.7.0",
  features = ["limit", "request-id", "timeout", "trace"]
}
tower-sessions = {
  version = "0.15.0",
  default-features = false,
  features = ["axum-core", "memory-store", "private"]
}
tower-sessions-redis-store = {
  git = "https://github.com/maxcountryman/tower-sessions-stores",
  rev = "69e025f"
}
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.3", features = ["serde", "v4"] }
