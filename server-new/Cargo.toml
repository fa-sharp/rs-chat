[package]
name = "rs-chat-api"
version = "0.1.0"
edition = "2024"
description = "LLM chat application"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["json", "query"] }
axum-helmet = "1.0.2"
axum-plugin = {
  git = "https://git.fasharp.io/fa-sharp/axum-plugin",
  rev = "9f72278b3c"
}
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "=0.3.49", default-features = false }
tokio = {
  version = "1.52.3",
  default-features = false,
  features = ["macros", "net", "rt", "rt-multi-thread", "signal"]
}
tower = { version = "0.5", default-features = false }
tower-http = {
  version = "0.7.0",
  features = [
    "limit",
    "request-id",
    "timeout",
    "trace",
  ]
}
tower-sessions = {
  version = "0.15.0",
  default-features = false,
  features = ["axum-core", "memory-store", "private"]
}
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
